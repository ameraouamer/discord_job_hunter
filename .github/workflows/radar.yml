name: Job Radar

on:
  schedule:
    - cron: "17 * * * *" # Every hour, at minute 17
  workflow_dispatch: # Allow manual execution

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Job Radar
        run: python job_radar.py --once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen jobs
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "update seen jobs"
          git pull --rebase origin master
          git push origin master