name: Job Radar

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      test:
        description: "Only send a test message to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:               # never run two at once
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send a test message
        if: ${{ inputs.test }}
        run: python job_radar.py --test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Look for jobs
        if: ${{ !inputs.test }}
        run: python job_radar.py --once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen jobs
        if: ${{ !inputs.test }}
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "update seen jobs"
          git pull --rebase
          git push